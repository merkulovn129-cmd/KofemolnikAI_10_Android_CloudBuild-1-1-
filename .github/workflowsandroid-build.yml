
name: Сборка Кофемольник ИИ APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Найти и распаковать проект
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ОШИБКА: ZIP проекта не найден в репозитории"
            exit 1
          fi
          mkdir -p source
          unzip -oq "$ZIP" -d source
          PROJECT=$(find source -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "ОШИБКА: В ZIP не найден Android-проект с settings.gradle"
            find source -maxdepth 3 -type f | head -n 50
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Настроить Android SDK
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Собрать APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: KofemolnikAI-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

